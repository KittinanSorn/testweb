<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock SF Cinema for Cypress Testing</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #fff; padding-bottom: 50px; }
    header { background: #1e293b; display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 2px solid #e11d48; }
    .logo { font-size: 24px; font-weight: bold; color: #e11d48; text-decoration: none; }
    nav a { color: #fff; text-decoration: none; margin: 0 15px; font-weight: 500; }
    nav a:hover { color: #e11d48; }
    .nav-right { display: flex; align-items: center; gap: 15px; }
    input[type="search"] { padding: 8px 12px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: #fff; }
    button { cursor: pointer; background: #e11d48; border: none; color: #fff; padding: 8px 16px; border-radius: 4px; font-weight: bold; }
    button:hover { background: #be123c; }
    .lang-btn { background: #334155; }
    
    .container { padding: 30px 5%; max-width: 1200px; margin: 0 auto; }
    .section-title { margin-bottom: 20px; border-left: 4px solid #e11d48; padding-left: 10px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .card { background: #1e293b; border-radius: 8px; overflow: hidden; padding: 15px; text-align: center; }
    .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 4px; background-color: #334155; }
    .card h3 { margin: 10px 0; font-size: 18px; }
    
    .time-btn { background: #334155; margin: 5px; padding: 6px 12px; border-radius: 4px; display: inline-block; cursor: pointer; }
    .time-btn:hover { background: #e11d48; }

    /* Seat Selection */
    .seat-grid { display: grid; grid-template-columns: repeat(3, 40px); gap: 10px; justify-content: center; margin: 20px 0; }
    .seat-available { width: 40px; height: 40px; background: #334155; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; }
    .seat-available.selected { background: #22c55e; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; padding: 30px; border-radius: 8px; width: 300px; position: relative; }
    .close { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; }
    .error-msg { color: #f43f5e; font-size: 12px; display: none; margin-top: 5px; }
  </style>
</head>
<body>

  <!-- Header / Navigation -->
  <header>
    <a href="#" class="logo">SF CINEMA</a>
    <nav>
      <a href="#movies" id="nav-movies">Movies</a>
      <a href="#cinemas" id="nav-cinemas">Cinemas</a>
      <a href="#promotions" id="nav-promotions">Promotions</a>
    </nav>
    <div class="nav-right">
      <input type="search" id="search-input" placeholder="Search movie...">
      <button class="lang-btn" id="lang-btn" onclick="toggleLang()">TH</button>
      <button onclick="openModal()" class="btn-login" id="login-btn">Login</button>
    </div>
  </header>

  <div class="container">
    <!-- Movies Section -->
    <section id="movies">
      <h2 class="section-title" id="title-movies">Now Showing</h2>
      <div class="grid" id="movie-list">
        <div class="card movie-card">
          <!-- รูปภาพโปสเตอร์จาก Unsplash Direct CDN -->
          <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400&q=80" alt="Avatar">
          <h3 class="title">Avatar</h3>
          <div class="showtime time-btn" onclick="alert('Selected 14:00')">14:00</div>
          <div class="showtime time-btn" onclick="alert('Selected 17:30')">17:30</div>
        </div>
      </div>
    </section>

    <br><hr><br>

    <!-- Cinemas Section -->
    <section id="cinemas">
      <h2 class="section-title" id="title-cinemas">Cinemas</h2>
      <div class="grid">
        <div class="card cinema-item" onclick="alert('Selected SF World Cinema')">
          <h3>SF World Cinema Central World</h3>
        </div>
      </div>
    </section>

    <br><hr><br>

    <!-- Seat Map Section -->
    <section id="seat-map-section" style="text-align: center;">
      <h2 class="section-title">Select Seat</h2>
      <div class="seat-grid">
        <div class="seat-available" onclick="toggleSeat(this)">A1</div>
        <div class="seat-available" onclick="toggleSeat(this)">A2</div>
        <div class="seat-available" onclick="toggleSeat(this)">A3</div>
      </div>
    </section>

    <br><hr><br>

    <!-- Promotions Section -->
    <section id="promotions">
      <h2 class="section-title" id="title-promotions">Promotions</h2>
      <div class="grid">
        <div class="card promo-card">
          <!-- รูปภาพแบนเนอร์จาก Unsplash Direct CDN -->
          <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&q=80" alt="Promo">
          <h3>Student Discount 50%</h3>
        </div>
      </div>
    </section>
  </div>

  <!-- Login Modal -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>Login</h2>
      <br>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <input type="text" id="username" placeholder="Email / Username" style="width: 100%; padding: 8px; margin-bottom: 5px; color: #000;">
        <div class="error-msg" id="error-msg">This field is required</div>
        <br><br>
        <button type="submit" style="width: 100%;">Submit</button>
      </form>
    </div>
  </div>

  <script>
    function toggleLang() {
      const btn = document.getElementById('lang-btn');
      if (btn.innerText === 'TH') {
        btn.innerText = 'EN';
        document.getElementById('nav-movies').innerText = 'ภาพยนตร์';
        document.getElementById('nav-cinemas').innerText = 'โรงภาพยนตร์';
        document.getElementById('nav-promotions').innerText = 'โปรโมชัน';
        document.getElementById('login-btn').innerText = 'เข้าสู่ระบบ';
        window.history.pushState({}, '', '?lang=th');
      } else {
        btn.innerText = 'TH';
        document.getElementById('nav-movies').innerText = 'Movies';
        document.getElementById('nav-cinemas').innerText = 'Cinemas';
        document.getElementById('nav-promotions').innerText = 'Promotions';
        document.getElementById('login-btn').innerText = 'Login';
        window.history.pushState({}, '', '?lang=en');
      }
    }

    function toggleSeat(el) {
      el.classList.toggle('selected');
    }

    function openModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('loginModal').style.display = 'none'; }
    function handleLogin(e) {
      e.preventDefault();
      const input = document.getElementById('username').value;
      if (!input) {
        document.getElementById('error-msg').style.display = 'block';
      } else {
        alert('LoggedIn!');
        closeModal();
      }
    }

    fetch('https://jsonplaceholder.typicode.com/todos/1')
      .then(response => response.json())
      .then(json => console.log('Mock API Loaded', json));
  </script>
</body>
</html>
